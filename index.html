<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DAILY RUNWAY - Google 登入測試</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google 官方登入 SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            limeBrand: '#91E000',
            darkBg: '#121413',
            darkCard: '#1E2220',
            darkBorder: '#2A302D',
          }
        }
      }
    }

    // ====== 請在下方替換成你的 Google 用戶端 ID ======
    const GOOGLE_CLIENT_ID = "830654234554-
u1912qvvcte7hu4cto1du8skikkacugp.apps.googleusercontent.com";
    // ===============================================

    let currentUser = JSON.parse(localStorage.getItem('runway_test_user')) || null;
  </script>
</head>
<body class="bg-darkBg text-white min-h-screen flex flex-col justify-between font-sans p-6 select-none">

  <!-- 頂部標題 -->
  <div>
    <div class="text-[11px] font-mono text-limeBrand font-bold uppercase tracking-widest">STEP 1 TEST</div>
    <h1 class="text-xl font-bold mt-1">Google 帳號一鍵登入測試</h1>
    <p class="text-xs text-gray-400 mt-1">驗證用戶端授權、自動獲取頭像與模特身分。</p>
  </div>

  <!-- 登入狀態展示卡片 -->
  <div class="my-auto bg-darkCard border border-darkBorder rounded-3xl p-6 flex flex-col items-center text-center space-y-4 shadow-xl">
    
    <!-- 頭像預覽 -->
    <div id="avatar-container" class="w-20 h-20 rounded-full bg-neutral-800 border-2 border-limeBrand flex items-center justify-center overflow-hidden">
      <i data-lucide="user" class="w-8 h-8 text-gray-400"></i>
    </div>

    <!-- 用戶資料文字 -->
    <div>
      <div id="user-status-badge" class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-neutral-800 text-gray-400 mb-1">
        尚未登入
      </div>
      <h2 id="display-name" class="text-base font-bold text-white">訪客模特</h2>
      <p id="display-email" class="text-xs text-gray-400 mt-0.5">點擊下方按鈕以 Google 帳號授權</p>
    </div>

    <!-- 登入 / 登出按鈕區 -->
    <div class="w-full pt-2">
      <button id="btn-login" onclick="triggerGoogleLogin()" class="w-full py-3 bg-white text-black font-bold rounded-2xl text-xs flex items-center justify-center space-x-2 active:scale-95 transition shadow-lg">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>使用 Google 帳號快速登入</span>
      </button>

      <button id="btn-logout" onclick="logout()" class="w-full py-3 bg-neutral-800 text-red-400 font-bold rounded-2xl text-xs hidden active:scale-95 transition">
        登出帳號
      </button>
    </div>

  </div>

  <!-- 底部說明 -->
  <div class="text-center text-[11px] text-gray-500">
    測試成功後，這組登入身分將直接套用至穿搭發布與個人衣櫥[span_2](start_span)[span_2](end_span)。
  </div>

  <script>
    lucide.createIcons();

    function triggerGoogleLogin() {
      if (typeof google === 'undefined') {
        alert("Google 登入套件載入中，請稍候再點一次。");
        return;
      }
      if (GOOGLE_CLIENT_ID.includes("YOUR_GOOGLE_CLIENT_ID")) {
        alert("請先在程式碼第 19 行填入你的 Google Client ID！");
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });
      google.accounts.id.prompt();
    }

    function handleCredentialResponse(response) {
      try {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        currentUser = {
          name: payload.name,
          email: payload.email,
          avatar: payload.picture
        };
        localStorage.setItem('runway_test_user', JSON.stringify(currentUser));
        renderUserUI();
        alert(`🎉 登入成功！歡迎 ${currentUser.name} 登上伸展台！`);
      } catch (err) {
        alert("解析登入資料失敗: " + err.message);
      }
    }

    function renderUserUI() {
      const avatarBox = document.getElementById('avatar-container');
      const nameEl = document.getElementById('display-name');
      const emailEl = document.getElementById('display-email');
      const badgeEl = document.getElementById('user-status-badge');
      const loginBtn = document.getElementById('btn-login');
      const logoutBtn = document.getElementById('btn-logout');

      if (currentUser) {
        avatarBox.innerHTML = `<img src="${currentUser.avatar}" class="w-full h-full object-cover">`;
        nameEl.innerText = currentUser.name;
        emailEl.innerText = currentUser.email;
        badgeEl.className = "inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-limeBrand/20 text-limeBrand mb-1";
        badgeEl.innerText = "已登入身分驗證";
        loginBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
      } else {
        avatarBox.innerHTML = `<i data-lucide="user" class="w-8 h-8 text-gray-400"></i>`;
        nameEl.innerText = "訪客模特";
        emailEl.innerText = "點擊下方按鈕以 Google 帳號授權";
        badgeEl.className = "inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-neutral-800 text-gray-400 mb-1";
        badgeEl.innerText = "尚未登入";
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        lucide.createIcons();
      }
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('runway_test_user');
      renderUserUI();
    }

    // 初始化渲染
    renderUserUI();
  </script>
</body>
</html>
